[package]
name = "finder-rs"
version = "1.0.0"
edition = "2024"
description = "A fast, light, keyboard-first file explorer for Windows with a Finder-style UI"
authors = ["Nardos Zebene"]
license = "GPL-3.0-only"
readme = "README.md"

# Versions are pinned on purpose (plan §10: upgrade Slint deliberately).
[dependencies]
# Software renderer only: ~20 MB idle RAM vs ~60 MB with the OpenGL renderer,
# and a smaller binary. Override at runtime with SLINT_BACKEND if needed.
# Patched (vendor/): crisp dark-mode text.
i-slint-renderer-software = "=1.18.1"
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "compat-1-18", "backend-winit", "renderer-software", "accessibility", "unstable-winit-030"] }
notify = { version = "=8.2.1", default-features = false }
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
rayon = "=1.12.0"
# Already used by zip; inflates compressed PDF streams for content search.
flate2 = "=1.1.10"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_System_Diagnostics_ToolHelp", "Win32_Graphics_Gdi", "Win32_System_Com", "Data_Pdf", "Storage", "Storage_Streams", "Foundation", "Graphics_Imaging", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell_Common", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_Media_MediaFoundation", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Controls"] }
zip = { version = "=9.2.3", default-features = false, features = ["deflate"] }
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=1.1.8"

[build-dependencies]
slint-build = "=1.18.1"
embed-resource = "=3.0.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# Unwind (not abort): a bug in a preview helper (e.g. the code highlighter)
# is caught and falls back instead of closing the window.
panic = "unwind"

# Optimised but quick to link, for benchmarking while iterating:
#   cargo run --profile fast --bin bench -- list <dir>
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
strip = false

# Keep debug builds usable: optimise dependencies (Slint's renderer is slow unoptimised).
[profile.dev.package."*"]
opt-level = 2

# Sharper text: Slint's software renderer with hinted glyphs (see
# vendor/i-slint-renderer-software/fonts/vectorfont.rs, "X Finder").
[patch.crates-io]
i-slint-renderer-software = { path = "vendor/i-slint-renderer-software" }
